name: Deploy site to GitHub Pages

# Build + publish the static Next.js export to GitHub Pages on every push
# (including the ETL bot's data refresh commits, so the site reflects new
# numbers). configure-pages@v5 with enablement: true means the FIRST run
# turns Pages on for the repo automatically — no manual setup required.
on:
  push:
    branches:
      - main
      - 'claude/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Auto-enable Pages on first run.
          enablement: true
          static_site_generator: next

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build static export
        working-directory: web
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
