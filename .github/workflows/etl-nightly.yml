name: ETL nightly

on:
  schedule:
    # 09:17 UTC = 03:17 MDT (summer) / 02:17 MST (winter) — runs after city batch jobs settle.
    - cron: "17 9 * * *"
  workflow_dispatch:
  push:
    # Re-run only when ETL-relevant code changes. Bot data commits, docs,
    # and frontend edits do NOT re-trigger.
    branches:
      - main
      - 'claude/**'
    paths:
      - 'etl/**'
      - 'db/**'
      - 'Makefile'
      - '.github/workflows/etl-nightly.yml'

concurrency:
  group: etl-nightly
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    # Skip the bot's own data commits as a belt-and-suspenders guard alongside paths-ignore.
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip-etl]')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Initialize SQLite DB
        run: make db

      # --- Bootstrap step: probe Socrata column names ----------------------
      # The Phase 1 ingest refuses to run without a verified column map
      # (data/raw/checkbook_columns.json). On GitHub-hosted runners we have
      # network access, so we always run the probe — it doubles as an API
      # smoke test, and commits any column-rename it detects.
      - name: Probe Denver Checkbook column map + date range + catalog + siblings
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          set -ex
          python -m etl.sources.denver_checkbook.scan --columns
          python -m etl.sources.denver_checkbook.scan --date-range
          python -m etl.sources.denver_checkbook.scan --catalog-search
          python -m etl.sources.denver_checkbook.scan --probe-siblings
          echo "--- probe artifacts preview ---"
          ls -la data/raw/
          head -40 data/raw/checkbook_date_range.json || true
          head -60 data/raw/socrata_catalog_denver_checkbook.json || true
          head -120 data/raw/sibling_dataset_probes.json || true

      - name: Commit probe artifacts if changed
        run: |
          set -ex
          git config user.name  "denver-tracker-bot"
          git config user.email "bot@denver-tracker.local"
          git add --ignore-errors -f \
            data/raw/checkbook_columns.json \
            data/raw/checkbook_date_range.json \
            data/raw/socrata_catalog_denver_checkbook.json \
            data/raw/sibling_dataset_probes.json || true
          git status --short
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Denver checkbook probe artifacts [skip-etl]"
            git push
          else
            echo "Probe artifacts unchanged."
          fi

      # --- Main ETL --------------------------------------------------------
      - name: Run ETL
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: make etl

      - name: Compute unit economics
        run: make compute

      # --- Curator-loop output: top unmatched vendors ----------------------
      # Surfaces large checkbook recipients that DIDN'T match a seed, so a
      # human can grow the seed list. Goes into artifacts only (not committed)
      # so we don't pollute the branch with churning CSVs.
      - name: Scan for new candidates
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python -m etl.sources.denver_checkbook.scan \
            --new-candidates --rows 20000 --top 200 || true

      - name: Commit refreshed processed data
        run: |
          git add data/processed
          if ! git diff --cached --quiet; then
            git commit -m "data: nightly ETL refresh [skip-etl]"
            git push
          else
            echo "No data changes."
          fi

      - name: Upload ETL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-output-${{ github.run_id }}
          path: |
            data/raw/checkbook_columns.json
            data/interim/
            data/processed/
          if-no-files-found: ignore
          retention-days: 30
