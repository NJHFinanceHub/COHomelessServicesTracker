name: ETL nightly

on:
  schedule:
    # 09:17 UTC = 03:17 MDT (summer) / 02:17 MST (winter) — runs after city batch jobs settle.
    - cron: "17 9 * * *"
  workflow_dispatch:

concurrency:
  group: etl-nightly
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r etl/requirements.txt

      - name: Initialize SQLite DB
        run: make db

      # --- Bootstrap step: probe Socrata column names ----------------------
      # The Phase 1 ingest refuses to run without a verified column map
      # (data/raw/checkbook_columns.json). On GitHub-hosted runners we have
      # network access, so we always run the probe — it doubles as an API
      # smoke test, and commits any column-rename it detects.
      - name: Probe Denver Checkbook column map
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python -m etl.sources.denver_checkbook.scan --columns

      - name: Commit column map if changed
        run: |
          git config user.name  "denver-tracker-bot"
          git config user.email "bot@denver-tracker.local"
          git add -f data/raw/checkbook_columns.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh Denver checkbook column map"
            git push
          else
            echo "Column map unchanged."
          fi

      # --- Main ETL --------------------------------------------------------
      - name: Run ETL
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: make etl

      - name: Compute unit economics
        run: make compute

      - name: Commit refreshed processed data
        run: |
          git add data/processed
          if ! git diff --cached --quiet; then
            git commit -m "data: nightly ETL refresh"
            git push
          else
            echo "No data changes."
          fi

      - name: Upload ETL artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: etl-output-${{ github.run_id }}
          path: |
            data/raw/checkbook_columns.json
            data/interim/
            data/processed/
          if-no-files-found: ignore
          retention-days: 30
